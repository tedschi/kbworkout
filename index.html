<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>12-Week Block</title>
<style>
  :root{
    --ink:#101319;
    --panel:#191e26;
    --panel-2:#212832;
    --line:#2c3441;
    --text:#e8ebf0;
    --muted:#8d97a6;
    --brass:#c9973f;
    --brass-dim:#6b5225;
    --teal:#5e9c95;
    --warn:#c06a52;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    padding-bottom:calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3{margin:0;font-weight:620;letter-spacing:-0.01em}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font:inherit;color:var(--text)}
  .num{font-variant-numeric:tabular-nums}

  /* header */
  header{
    position:sticky;top:0;z-index:40;background:rgba(16,19,25,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 0;
  }
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wk{display:flex;align-items:center;gap:6px}
  .wk button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:17px;line-height:1}
  .wk button:active{background:var(--panel-2)}
  .wkname{font-size:19px;font-weight:640;min-width:74px;text-align:center}
  .phase{font-size:13px;color:var(--brass)}
  .phase.deload{color:var(--teal)}
  .daytabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .daytabs::-webkit-scrollbar{display:none}
  .daytab{
    padding:9px 12px 10px;font-size:14px;color:var(--muted);white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .daytab.on{color:var(--text);border-bottom-color:var(--brass)}
  .daytab.done::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--teal);margin-left:6px;vertical-align:middle}

  main{padding:14px 14px 0}

  /* exercise */
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .exhead{padding:12px 13px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .exname{font-size:16px;font-weight:600}
  .exmeta{font-size:13px;color:var(--muted);margin-top:2px}
  .exnote{font-size:13px;color:var(--brass);margin-top:3px}
  .last{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:2px}

  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;
    padding:7px 13px;border-top:1px solid var(--line)}
  .setn{font-size:13px;color:var(--muted)}
  .setn.bo{font-size:11px;color:var(--brass)}
  .fld{position:relative}
  .fld input{
    width:100%;background:var(--panel-2);border:1px solid transparent;border-radius:8px;
    padding:10px 8px 10px 10px;font-size:16px;text-align:left;
    font-variant-numeric:tabular-nums;
  }
  .fld input:focus{outline:none;border-color:var(--brass-dim);background:#252d38}
  .fld span{position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted);pointer-events:none}
  .tick{
    width:42px;height:40px;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);font-size:17px;display:flex;align-items:center;justify-content:center;
  }
  .tick.on{background:var(--brass);border-color:var(--brass);color:#141313;font-weight:700}
  .setrow.done .fld input{opacity:.62}

  .exfoot{padding:9px 13px;border-top:1px solid var(--line);display:flex;gap:14px}
  .exfoot button{font-size:13px;color:var(--muted)}
  .exfoot button:active{color:var(--text)}

  /* session note */
  .note{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 12px;font-size:15px;min-height:62px;resize:vertical;margin-bottom:14px}
  .note:focus{outline:none;border-color:var(--brass-dim)}

  .callout{background:var(--panel);border-left:2px solid var(--brass);border-radius:0 var(--r) var(--r) 0;
    padding:11px 13px;font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .callout b{color:var(--text);font-weight:600}
  .rest{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:14px}

  /* rest timer bar */
  .timerbar{
    position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:45;
    background:rgba(25,30,38,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:9px 14px;
  }
  .clock{font-size:26px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;min-width:74px}
  .clock.run{color:var(--brass)}
  .clock.zero{color:var(--teal)}
  .tbtn{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;color:var(--muted)}
  .tbtn:active{background:var(--panel-2);color:var(--text)}

  /* bottom nav */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(16,19,25,.97);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{padding:10px 0 11px;font-size:12px;color:var(--muted)}
  nav button.on{color:var(--brass)}

  /* generic panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card h3{font-size:15px;margin-bottom:9px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .kv:first-of-type{border-top:none}
  .kv span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .big{font-size:34px;font-weight:660;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1.1}
  .sub{font-size:13px;color:var(--muted);margin-top:3px}
  .entry{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
  .entry input{background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:11px 10px;font-size:16px;width:100%}
  .entry input:focus{outline:none;border-color:var(--brass-dim)}
  .entry button{padding:0 18px;background:var(--brass);color:#141313;border-radius:8px;font-weight:640;font-size:15px}
  .ghost{padding:11px 0;width:100%;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--muted);margin-top:8px}
  .ghost.danger{color:var(--warn);border-color:#40312c}
  ul.plain{margin:0;padding-left:17px;font-size:14px;color:var(--muted);line-height:1.65}
  ul.plain li{margin-bottom:5px}
  ul.plain b{color:var(--text);font-weight:600}
  .rowlog{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .rowlog button{color:var(--muted);font-size:13px}
  .hide{display:none}
  .spark{width:100%;height:58px;display:block;margin-top:12px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="wk">
      <button id="wprev" aria-label="Previous week">‹</button>
      <div class="wkname">Week <span id="wknum" class="num">1</span></div>
      <button id="wnext" aria-label="Next week">›</button>
    </div>
    <div class="phase" id="phase">Re-accumulation</div>
  </div>
  <div class="daytabs" id="daytabs"></div>
</header>

<main>
  <section id="v-train"></section>
  <section id="v-body" class="hide"></section>
  <section id="v-food" class="hide"></section>
  <section id="v-plan" class="hide"></section>
  <section id="v-data" class="hide"></section>
</main>

<div class="timerbar" id="timerbar">
  <div class="clock" id="clock">2:00</div>
  <button class="tbtn" data-t="120">2 min</button>
  <button class="tbtn" data-t="180">3 min</button>
  <button class="tbtn" id="tstop">Stop</button>
</div>

<nav>
  <button data-v="train" class="on">Train</button>
  <button data-v="body">Body</button>
  <button data-v="food">Food</button>
  <button data-v="plan">Plan</button>
  <button data-v="data">Data</button>
</nav>

<script>
"use strict";
/* ---------------- storage ---------------- */
const KEY="kb12.v1";
const blank={sets:{},bw:{},food:{},notes:{},ui:{week:1,day:"la"}};
let S;
try{ S=Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ S=JSON.parse(JSON.stringify(blank)); }
for(const k in blank) if(S[k]==null) S[k]=JSON.parse(JSON.stringify(blank[k]));
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
},180); }

/* ---------------- program ---------------- */
const E=(id,name,sets,reps,o={})=>Object.assign({id,name,sets,reps},o);

function dayPlan(week,day){
  if(week===12){
    if(day==="lb") return {title:"Test day",ex:TEST,test:true};
    if(day==="ub") return {title:"Rest",ex:[]};
  }
  const b = week<=4?1 : week<=8?2 : 3;
  const deload = (week===8) || (week===12 && (day==="la"||day==="ua"));
  const p = b===1?B1(week):b===2?B2():B3();
  let ex = p[day].map(x=>Object.assign({},x));
  if(deload) ex = ex.map(x=>Object.assign({},x,{sets:2,backoff:false,note:"Deload — about 60% of last week's load"}));
  return {title:DAYNAME[day],ex,deload};
}

const DAYNAME={la:"Lower A",ua:"Upper A",lb:"Lower B",ub:"Upper B",sa:"Saturday"};

function B1(week){
  const S1 = week<=2?3:4;
  return {
  la:[E("fsq","Double KB front squat",S1,"8–10",{hint:"Start double 50s"}),
      E("rfess","Rear-foot-elevated split squat",3,"10 / leg"),
      E("rdl","Double KB RDL",3,"10"),
      E("scarry","Suitcase carry",3,"40 sec / side")],
  ua:[E("floorpress","Double KB floor press",S1,"8–10"),
      E("ohp","Double KB strict press",3,"8"),
      E("gorilla","Gorilla row",3,"10 / side"),
      E("bupress","Bottoms-up press",3,"6 / side",{hint:"Stays at 35 lb — technical lift, not a loading lift"})],
  lb:[E("swing","Double KB swing",5,"10",{hint:"Full recovery between sets"}),
      E("goblet","Goblet squat",3,"12",{hint:"70 lb"}),
      E("slrdl","Single-leg RDL",3,"10 / leg"),
      E("frcarry","Front-rack carry",3,"40 sec",{hint:"Double 50s"})],
  ub:[E("pullup","Pull-ups",4,"max − 2",{hint:"Stop two shy of failure on every set"}),
      E("row","Double KB bent-over row",3,"10"),
      E("hkpress","Half-kneeling single-arm press",3,"8 / side"),
      E("pushup","Push-ups",3,"15–20"),
      E("hollow","Hollow hold",3,"45 sec")],
  sa:SAT};
}
function B2(){ return {
  la:[E("fsq","Double KB front squat",4,"4–6",{hint:"Double 88s, or 88 + 70"}),
      E("zercher","Zercher sandbag squat",4,"6–8"),
      E("rdl","Double KB RDL",3,"8–10"),
      E("scarry","Suitcase carry",3,"40 sec / side")],
  ua:[E("floorpress","Double KB floor press",4,"5",{hint:"Double 70s"}),
      E("ohp","Double KB strict press",4,"4–6"),
      E("gorilla","Gorilla row",3,"8–10"),
      E("bupress","Bottoms-up press",3,"6 / side",{hint:"Stays at 35 lb"})],
  lb:[E("shoulder","Sandbag shouldering",5,"3 / side"),
      E("swing","Double KB swing",4,"10"),
      E("slrdl","Single-leg RDL",3,"8–10"),
      E("frcarry","Front-rack carry",3,"40 sec")],
  ub:[E("wpullup","Weighted pull-up",4,"5",{hint:"Vest"}),
      E("row","Double KB bent-over row",4,"6"),
      E("hkpress","Half-kneeling single-arm press",3,"8"),
      E("vpushup","Vest push-ups",3,"12–15"),
      E("hollow","Hollow hold",3,"45 sec")],
  sa:SAT};
}
function B3(){ return {
  la:[E("fsq","Double KB front squat",5,"3–5",{backoff:true}),
      E("zercher","Zercher sandbag squat",5,"3–5",{backoff:true}),
      E("rdl","Double KB RDL",2,"8"),
      E("scarry","Suitcase carry",2,"40 sec / side")],
  ua:[E("floorpress","Double KB floor press",5,"3–5",{backoff:true}),
      E("ohp","Double KB strict press",5,"3–5",{backoff:true}),
      E("gorilla","Gorilla row",2,"8"),
      E("bupress","Bottoms-up press",2,"6 / side")],
  lb:[E("shoulder","Sandbag shouldering",5,"2 / side",{backoff:true}),
      E("swing","Double KB swing",4,"10"),
      E("slrdl","Single-leg RDL",2,"8"),
      E("frcarry","Front-rack carry",2,"40 sec")],
  ub:[E("wpullup","Weighted pull-up",5,"3–5",{backoff:true}),
      E("row","Double KB bent-over row",5,"5"),
      E("hkpress","Half-kneeling single-arm press",2,"8"),
      E("vpushup","Vest push-ups",2,"12"),
      E("hollow","Hollow hold",2,"45 sec")],
  sa:SAT};
}
const SAT=[E("emom","EMOM × 15",15,"10 swings / 8 goblet squats / 6 push-ups",
  {hint:"Only if all four weekday sessions happened. Being smoked is the point here."})];
const TEST=[
  E("t_fsq","Double 88 front squat",1,"reps at 5"),
  E("t_ohp","Strict double 70 press",1,"max reps"),
  E("t_pull","Weighted pull-up",1,"heaviest for 3"),
  E("t_bag","Sandbag shoulder",1,"heaviest single"),
  E("t_farm","Farmer carry, double 88s",1,"max distance")];

const PHASE=w=> w<=4?["Re-accumulation",false] : w===8?["Deload",true] :
  w<=8?["Load",false] : w===12?["Deload & test",true] : ["Intensification",false];

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const key=(w,d,ex,i)=>`w${w}.${d}.${ex}.${i}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{const[y,m,dd]=d.split("-");return `${+m}/${+dd}`;};

function dayDone(w,d){
  const p=dayPlan(w,d); if(!p.ex.length) return false;
  let total=0,done=0;
  p.ex.forEach(x=>{const n=x.sets+(x.backoff?1:0);
    for(let i=0;i<n;i++){total++; if((S.sets[key(w,d,x.id,i)]||{}).done) done++;}});
  return total>0 && done/total>=0.6;
}
function lastTime(week,day,exId){
  for(let w=week-1;w>=1;w--){
    const hits=[];
    for(let i=0;i<8;i++){const v=S.sets[key(w,day,exId,i)];
      if(v&&v.done&&(v.w||v.r)) hits.push(v);}
    if(hits.length){const b=hits[hits.length-1];
      return `wk ${w} · ${b.w?b.w+" lb":""}${b.w&&b.r?" × ":""}${b.r||""}`;}
  }
  return "";
}

/* ---------------- train view ---------------- */
function renderTabs(){
  const w=S.ui.week;
  const days = w===12?["la","ua","lb"]:["la","ua","lb","ub","sa"];
  if(!days.includes(S.ui.day)) S.ui.day=days[0];
  $("#daytabs").innerHTML = days.map(d=>{
    const lbl = (w===12&&d==="lb")?"Test day":DAYNAME[d];
    return `<button class="daytab ${d===S.ui.day?"on":""} ${dayDone(w,d)?"done":""}" data-d="${d}">${lbl}</button>`;
  }).join("");
  $("#wknum").textContent=w;
  const [nm,dl]=PHASE(w);
  $("#phase").textContent=nm;
  $("#phase").className="phase"+(dl?" deload":"");
}

function renderTrain(){
  const w=S.ui.week,d=S.ui.day,p=dayPlan(w,d);
  let h="";

  if(w===1&&d==="la") h+=`<div class="callout"><b>This block should feel too easy.</b> You're not detrained in strength, you're detrained in volume. Opening at RPE 9 is how this stalls.</div>`;
  if(p.test) h+=`<div class="callout"><b>Test day.</b> Record these. They replace the old barbell numbers.</div>`;
  if(p.deload) h+=`<div class="callout"><b>Deload.</b> Two sets, roughly 60% of last week's loads. Non-negotiable.</div>`;
  if(d==="sa") h+=`<div class="callout"><b>Optional.</b> Skip it unless all four weekday sessions happened.</div>`;

  if(!p.ex.length){
    h+=`<div class="card"><h3>Rest</h3><div class="sub">Nothing scheduled. Eat, sleep, hold the baby.</div></div>`;
  }

  p.ex.forEach(x=>{
    const n=x.sets+(x.backoff?1:0);
    const lt=lastTime(w,d,x.id);
    h+=`<div class="ex" data-ex="${x.id}">
      <div class="exhead">
        <div>
          <div class="exname">${esc(x.name)}</div>
          <div class="exmeta num">${x.sets} × ${esc(x.reps)}${x.backoff?" + back-off":""}</div>
          ${x.hint?`<div class="exnote">${esc(x.hint)}</div>`:""}
          ${x.note?`<div class="exnote">${esc(x.note)}</div>`:""}
        </div>
        ${lt?`<div class="last">${esc(lt)}</div>`:""}
      </div>`;
    for(let i=0;i<n;i++){
      const bo = x.backoff && i===n-1;
      const v = S.sets[key(w,d,x.id,i)]||{};
      h+=`<div class="setrow ${v.done?"done":""}" data-i="${i}">
        <div class="setn ${bo?"bo":""}">${bo?"B/O":i+1}</div>
        <div class="fld"><input type="number" inputmode="decimal" step="1" data-f="w" value="${v.w??""}" placeholder="—"><span>lb</span></div>
        <div class="fld"><input type="number" inputmode="numeric" step="1" data-f="r" value="${v.r??""}" placeholder="—"><span>reps</span></div>
        <button class="tick ${v.done?"on":""}" data-f="done">✓</button>
      </div>`;
    }
    h+=`<div class="exfoot">
          <button data-act="fill">Copy first set down</button>
          <button data-act="clear">Clear</button>
        </div></div>`;
  });

  if(p.ex.length){
    h+=`<textarea class="note" id="snote" placeholder="How did it go? Sleep, loads that felt wrong, anything to change.">${esc(S.notes[`w${w}.${d}`]||"")}</textarea>`;
  }
  $("#v-train").innerHTML=h;
}

/* input handling */
$("#v-train").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="snote"){ S.notes[`w${S.ui.week}.${S.ui.day}`]=t.value; save(); return; }
  if(t.tagName!=="INPUT") return;
  const row=t.closest(".setrow"), ex=t.closest(".ex");
  const k=key(S.ui.week,S.ui.day,ex.dataset.ex,row.dataset.i);
  const v=S.sets[k]||(S.sets[k]={});
  const val=t.value===""?undefined:Number(t.value);
  v[t.dataset.f]=val; save();
});
$("#v-train").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const ex=b.closest(".ex"); if(!ex) return;
  const w=S.ui.week,d=S.ui.day,id=ex.dataset.ex;

  if(b.dataset.f==="done"){
    const row=b.closest(".setrow");
    const k=key(w,d,id,row.dataset.i);
    const v=S.sets[k]||(S.sets[k]={});
    v.done=!v.done;
    b.classList.toggle("on",!!v.done);
    row.classList.toggle("done",!!v.done);
    if(v.done){ if(navigator.vibrate) navigator.vibrate(12); startTimer(restFor()); }
    save(); renderTabs(); return;
  }
  if(b.dataset.act==="fill"){
    const first=S.sets[key(w,d,id,0)];
    if(!first) return;
    ex.querySelectorAll(".setrow").forEach(r=>{
      if(r.dataset.i==="0") return;
      const k=key(w,d,id,r.dataset.i);
      const v=S.sets[k]||(S.sets[k]={});
      if(first.w!==undefined) v.w=first.w;
      if(first.r!==undefined) v.r=first.r;
    });
    save(); renderTrain(); return;
  }
  if(b.dataset.act==="clear"){
    ex.querySelectorAll(".setrow").forEach(r=>{ delete S.sets[key(w,d,id,r.dataset.i)]; });
    save(); renderTrain(); renderTabs(); return;
  }
});

/* ---------------- rest timer ---------------- */
let tEnd=0,tInt=null;
const restFor=()=> S.ui.week<=4?120:180;
function startTimer(sec){
  tEnd=Date.now()+sec*1000;
  clearInterval(tInt); tInt=setInterval(tickTimer,200); tickTimer();
}
function tickTimer(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  const c=$("#clock");
  c.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  c.className="clock "+(left===0?"zero":"run");
  if(left===0){ clearInterval(tInt); tInt=null; if(navigator.vibrate) navigator.vibrate([90,60,90]); beep(); }
}
function beep(){
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)();
    const o=A.createOscillator(),g=A.createGain();
    o.frequency.value=660; o.connect(g); g.connect(A.destination);
    g.gain.setValueAtTime(.0001,A.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,A.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.5);
    o.start(); o.stop(A.currentTime+.5);
  }catch(e){}
}
$("#timerbar").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="tstop"){ clearInterval(tInt); tInt=null; $("#clock").textContent="0:00"; $("#clock").className="clock"; return; }
  startTimer(+b.dataset.t);
});

/* ---------------- body ---------------- */
function bwStats(){
  const ks=Object.keys(S.bw).sort();
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const last7=ks.slice(-3).map(k=>S.bw[k]);
  const prev7=ks.slice(-6,-3).map(k=>S.bw[k]);
  return {ks,cur:avg(last7),prev:avg(prev7)};
}
function renderBody(){
  const {ks,cur,prev}=bwStats();
  const delta = (cur!=null&&prev!=null)?cur-prev:null;
  let advice="Log three mornings a week. Two weeks of data before you change anything.";
  if(delta!=null){
    if(delta<0.35) advice="Trend is flat or falling. If it holds another week, add 250 cal — a cup of whole milk and a spoonful of peanut butter.";
    else if(delta>1.0) advice="Climbing faster than 1 lb/week. If it holds another week, pull 250 cal back out.";
    else advice="Right in the window. Change nothing.";
  }
  const pts=ks.slice(-21).map(k=>S.bw[k]);
  let spark="";
  if(pts.length>1){
    const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
    const d=pts.map((v,i)=>`${(i/(pts.length-1))*100},${52-((v-mn)/rg)*44}`).join(" ");
    spark=`<svg class="spark" viewBox="0 0 100 58" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="#c9973f" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
  }
  $("#v-body").innerHTML=`
    <div class="card">
      <div class="big">${cur!=null?cur.toFixed(1):"—"}<span style="font-size:16px;color:var(--muted);font-weight:400"> lb</span></div>
      <div class="sub">3-day average${delta!=null?` · ${delta>=0?"+":""}${delta.toFixed(1)} lb vs. last week`:""}</div>
      ${spark}
      <div class="entry">
        <input id="bwin" type="number" inputmode="decimal" step="0.1" placeholder="This morning's weight">
        <button id="bwadd">Log</button>
      </div>
    </div>
    <div class="callout">${advice}</div>
    <div class="card"><h3>Recent</h3>
      ${ks.slice(-10).reverse().map(k=>`<div class="rowlog"><span>${fmtD(k)}</span><span>${S.bw[k].toFixed(1)} lb <button data-del="${k}">×</button></span></div>`).join("")||'<div class="sub">Nothing logged yet.</div>'}
    </div>`;
}
$("#v-body").addEventListener("click",e=>{
  if(e.target.id==="bwadd"){
    const v=parseFloat($("#bwin").value); if(!isFinite(v)) return;
    S.bw[today()]=v; save(); renderBody(); return;
  }
  const k=e.target.dataset&&e.target.dataset.del;
  if(k){ delete S.bw[k]; save(); renderBody(); }
});

/* ---------------- food ---------------- */
function renderFood(){
  const t=today(), f=S.food[t]||{};
  const ks=Object.keys(S.food).sort().slice(-7);
  const hit=ks.filter(k=>(S.food[k].p||0)>=175).length;
  $("#v-food").innerHTML=`
    <div class="card">
      <div class="big">${f.p||0}<span style="font-size:16px;color:var(--muted);font-weight:400"> / 180 g protein</span></div>
      <div class="sub">${f.cal||0} / 3,050 cal today · hit protein ${hit} of the last ${ks.length||0} days</div>
      <div class="entry"><input id="pin" type="number" inputmode="numeric" placeholder="Protein, g" value="${f.p||""}"><button id="fsave">Save</button></div>
      <div class="entry"><input id="cin" type="number" inputmode="numeric" placeholder="Calories (rough is fine)" value="${f.cal||""}"></div>
    </div>
    <div class="callout">Protein is the only number that has to be right. Calories are a sanity check — if the scale is moving correctly, they're correct by definition.</div>
    <div class="card"><h3>Default day</h3>
      <ul class="plain">
        <li><b>Breakfast</b> — 4 eggs, 2 slices toast with butter, 16 oz whole milk · 45 g</li>
        <li><b>Mid-morning</b> — Greek yogurt, granola, honey · 25 g</li>
        <li><b>Lunch</b> — 8 oz chicken thigh, 1.5 cups rice, olive oil, vegetable · 50 g</li>
        <li><b>Afternoon</b> — whey in milk, handful of nuts · 35 g</li>
        <li><b>Dinner</b> — 6 oz ground beef, potatoes or pasta, vegetable · 35 g</li>
      </ul>
    </div>
    <div class="card"><h3>Newborn-proofing</h3>
      <ul class="plain">
        <li>Whole milk is the lever — cheapest, lowest-effort 300–600 cal when there's no time to cook.</li>
        <li>Batch 3 lbs of chicken thighs and a pot of rice on Sunday. Four lunches handled.</li>
        <li>Keep jerky, tuna packets and whey wherever you do night feeds.</li>
        <li>Missed meals are the failure mode, not bad meals. A gas-station sandwich beats nothing.</li>
      </ul>
    </div>
    <div class="card"><h3>Cheapest protein per dollar</h3>
      <div class="sub">Eggs · whole milk · chicken thighs · cottage cheese · Greek yogurt · canned tuna · 85/15 beef · whey · lentils</div>
    </div>`;
}
$("#v-food").addEventListener("click",e=>{
  if(e.target.id!=="fsave") return;
  const t=today(), f=S.food[t]||(S.food[t]={});
  const p=parseInt($("#pin").value,10), c=parseInt($("#cin").value,10);
  f.p=isFinite(p)?p:0; f.cal=isFinite(c)?c:0; save(); renderFood();
});

/* ---------------- plan ---------------- */
function renderPlan(){
  $("#v-plan").innerHTML=`
    <div class="card"><h3>The three rules</h3>
      <ul class="plain">
        <li><b>Rest is prescribed.</b> 2–3 min between sets of primaries. Ticking a set starts the timer for you. Under 35 minutes means you rested too little.</li>
        <li><b>Leave two reps in reserve.</b> If you can't hit the top of the range on the last set at 2 RIR, go lighter.</li>
        <li><b>Minimum viable session.</b> Bad night? First two exercises, then stop. That counts. Don't skip.</li>
      </ul>
    </div>
    <div class="card"><h3>Twelve weeks</h3>
      <div class="kv"><span>Weeks 1–4 · Re-accumulation</span><span>8–10 reps, RPE 7</span></div>
      <div class="kv"><span>Weeks 5–7 · Load</span><span>4–6 reps, RPE 8</span></div>
      <div class="kv"><span>Week 8 · Deload</span><span>2 sets, 60%</span></div>
      <div class="kv"><span>Weeks 9–11 · Intensification</span><span>3–5 reps + back-off</span></div>
      <div class="kv"><span>Week 12 · Deload &amp; test</span><span>Thursday</span></div>
    </div>
    <div class="card"><h3>Equipment, in priority order</h3>
      <div class="kv"><span>Doorway pull-up bar</span><span>week 1 · $35</span></div>
      <div class="kv"><span>Adjustable sandbag, 150–200 lb</span><span>week 1–5 · $120</span></div>
      <div class="kv"><span>88 lb bell ×1, second later</span><span>week 5 · $250 ea.</span></div>
      <div class="kv"><span>Weight vest, 40–60 lb</span><span>week 5 · $130</span></div>
    </div>
    <div class="card"><h3>Week 12 benchmarks</h3>
      <ul class="plain">
        <li>Double 88 front squat — reps at 5</li>
        <li>Strict double 70 press — max reps</li>
        <li>Weighted pull-up — heaviest for 3</li>
        <li>Sandbag shoulder — heaviest single</li>
        <li>Farmer carry, double 88s — max distance</li>
      </ul>
    </div>
    <div class="card"><h3>Nutrition</h3>
      <div class="kv"><span>Calories</span><span>3,000–3,100</span></div>
      <div class="kv"><span>Protein</span><span>180 g</span></div>
      <div class="kv"><span>Rate of gain</span><span>0.5–0.75 lb / week</span></div>
    </div>`;
}

/* ---------------- data ---------------- */
function renderData(){
  const sets=Object.keys(S.sets).length, days=Object.keys(S.bw).length;
  $("#v-data").innerHTML=`
    <div class="card"><h3>Your data</h3>
      <div class="kv"><span>Sets logged</span><span>${sets}</span></div>
      <div class="kv"><span>Weigh-ins</span><span>${days}</span></div>
      <div class="kv"><span>Stored</span><span>this browser only</span></div>
      <button class="ghost" id="exp">Download backup</button>
      <button class="ghost" id="impb">Restore from backup</button>
      <input type="file" id="imp" accept="application/json" class="hide">
    </div>
    <div class="callout">Everything lives in this browser. Clearing site data wipes it — download a backup every few weeks.</div>
    <div class="card"><h3>Session notes</h3>
      ${Object.keys(S.notes).filter(k=>S.notes[k]).reverse().slice(0,12)
        .map(k=>`<div class="rowlog"><span>${k.replace("."," · ")}</span></div><div class="sub" style="margin-bottom:8px">${esc(S.notes[k])}</div>`)
        .join("")||'<div class="sub">No notes yet.</div>'}
    </div>
    <div class="card"><h3>Start over</h3>
      <button class="ghost danger" id="wipe">Erase everything</button>
    </div>`;
}
$("#v-data").addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="exp"){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
    a.download=`kb12-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
  if(id==="impb") $("#imp").click();
  if(id==="wipe"){
    if(confirm("Erase all logged sets, weigh-ins and notes?")){
      S=JSON.parse(JSON.stringify(blank)); save(); renderAll();
    }
  }
});
document.addEventListener("change",e=>{
  if(e.target.id!=="imp") return;
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign({},blank,JSON.parse(r.result)); save(); renderAll(); }
    catch(err){ alert("That file couldn't be read. Pick a backup downloaded from this app."); } };
  r.readAsText(f);
});

/* ---------------- nav ---------------- */
let view="train";
function renderAll(){
  renderTabs();
  if(view==="train") renderTrain();
  if(view==="body") renderBody();
  if(view==="food") renderFood();
  if(view==="plan") renderPlan();
  if(view==="data") renderData();
}
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  view=b.dataset.v;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["train","body","food","plan","data"].forEach(v=>$("#v-"+v).classList.toggle("hide",v!==view));
  document.querySelector("header").style.display = view==="train"?"":"none";
  $("#timerbar").style.display = view==="train"?"":"none";
  window.scrollTo(0,0);
  renderAll();
});
$("#wprev").onclick=()=>{ if(S.ui.week>1){S.ui.week--; save(); renderAll(); window.scrollTo(0,0);} };
$("#wnext").onclick=()=>{ if(S.ui.week<12){S.ui.week++; save(); renderAll(); window.scrollTo(0,0);} };
$("#daytabs").addEventListener("click",e=>{
  const b=e.target.closest(".daytab"); if(!b) return;
  S.ui.day=b.dataset.d; save(); renderTabs(); renderTrain(); window.scrollTo(0,0);
});

renderAll();
</script>
</body>
</html>
